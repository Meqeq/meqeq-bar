<div
  class="flex flex-column h-screen flex-col-reverse items-end"
  (click)="close()"
>
  <input type="text" class="input pika-single text-xl hidden" #datePicker />

  <div #calendar class="text-2xl flex flex-col bg-base-100">
    <div class="text-3xl text-base-content font-bold p-2 text-center">
      <span class="">{{ time() | date: "HH:mm:ss" }}</span>
    </div>
  </div>
</div>

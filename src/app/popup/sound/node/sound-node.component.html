<div class="py-2" [class.text-red-400]="active()">
  <p class="text-lg font-bold">
    {{ node().description }}
  </p>
  <p class="text-sm mb-2">
    {{ node().nick }}
  </p>

  <div class="w-full">
    <input
      class="range range-xs w-full"
      type="range"
      step="0.01"
      min="0"
      max="1"
      [formControl]="volumeControl"
    />
    <div class="flex justify-between text-xs my-1">
      <span>|</span>
      <span>|</span>
      <span>|</span>
      <span>|</span>
      <span>|</span>
    </div>
    <div class="flex justify-between text-xs text-center -mx-3">
      <div class="w-6 pl-1">0</div>
      <div class="w-6">25</div>
      <div class="w-6">50</div>
      <div class="w-6">75</div>
      <div class="w-6 pr-1">100</div>
    </div>
  </div>
</div>

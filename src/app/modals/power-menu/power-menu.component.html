<div class="flex w-192 h-48">
  @for (option of options; track $index) {
    <div
      class="btn btn-ghost rounded-box flex flex-col justify-center items-center gap-4 flex-1 h-full cursor-pointer hover:bg-base-200 {{
        option.class
      }}"
      (click)="option.action()"
    >
      <lucide-icon [img]="option.icon" [size]="64"></lucide-icon>
      <div>{{ option.label }}</div>
    </div>
  }
</div>

<div class="flex items-center">
  <div class="flex-1">
    <div>{{ title() }}</div>
    @if (description()) {
      <div class="text-xs uppercase font-semibold opacity-60 mt-1">
        {{ description() }}
      </div>
    }
  </div>

  <div class="flex gap-2">
    @if (type() === "output" || type() === "input") {
      <button
        [disabled]="disabled()"
        class="btn btn-sm btn-ghost btn-square"
        [class.text-primary]="default()"
        (click)="default.set(true)"
      >
        <lucide-icon [img]="icons.check" [size]="20"></lucide-icon>
      </button>
    }

    <button
      [disabled]="disabled()"
      class="btn btn-sm btn-ghost btn-square"
      (click)="muted.set(!muted())"
    >
      <lucide-icon [img]="muteIcon()" [size]="20"></lucide-icon>
    </button>

    @if (type() === "output" || type() === "input") {
      <button
        [disabled]="disabled()"
        class="btn btn-sm btn-square"
        [class.btn-ghost]="!showSettings()"
        [class.btn-secondary]="showSettings()"
        (click)="showSettings.set(!showSettings())"
      >
        <lucide-icon [img]="icons.settings" [size]="20"></lucide-icon>
      </button>
    }
  </div>
</div>

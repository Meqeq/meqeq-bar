<div class="flex text-white items-center gap-1">
  @for (workspace of workspaces(); track workspace.id) {
    <div
      class="text-lg leading-none w-10 h-10 p-2 border-2 border-gray-800 rounded-full bg-gray-800 text-center font-bold workspace shadow-lg"
      [class.cursor-pointer]="workspace.id !== activeWorkspace()"
      [class.hover:bg-gray-900]="workspace.id !== activeWorkspace()"
      [class.active]="workspace.id === activeWorkspace()"
      (click)="
        workspace.id !== activeWorkspace() && setCurrentWorkspace(workspace.id)
      "
    >
      <span>{{ workspace.id }}</span>
    </div>
  }
</div>

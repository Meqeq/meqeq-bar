<div
  class="hover:text-primary h-full flex justify-center items-center cursor-pointer group"
>
  <lucide-icon [img]="sinkIcon()" [size]="18" class="-mr-[0px]"></lucide-icon>
  <div class="max-w-0 group-hover:max-w-10 overflow-hidden transition-all">
    <div class="text-sm font-mono" [class.text-error]="volume() > 100">
      {{ volume() | number: "1.0-0" }}%
    </div>
  </div>
</div>

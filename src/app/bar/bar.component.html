<div class="flex flex-col justify-end items-end h-screen p-3 relative">
  @if (barService.isPopupOpen()) {
    <div
      class="w-screen h-screen absolute top-0 left-0"
      (click)="barService.closePopup()"
    ></div>
  }

  <div class="py-3">
    <router-outlet></router-outlet>
  </div>

  <main class="w-full flex justify-between items-center">
    <app-workspaces [monitor]="barService.monitor()"></app-workspaces>

    <app-window-name></app-window-name>

    <div class="flex gap-2">
      @if (barService.monitor() === 0) {
        <app-sound (click)="barService.openPopup($event, 'sound')"></app-sound>

        <app-tray></app-tray>

        <app-clock
          (click)="barService.openPopup($event, 'calendar')"
        ></app-clock>
      }
    </div>
  </main>
</div>

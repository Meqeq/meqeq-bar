<main class="flex justify-between px-3">
  <app-workspaces [monitor]="monitor()"></app-workspaces>

  <app-window-name></app-window-name>

  <div class="flex gap-2">
    @if (monitor() === 0) {
      <app-sound></app-sound>

      <app-tray></app-tray>

      <app-clock></app-clock>
    }
  </div>
</main>

<ng-template #menuTemplate let-item>
  <div class="py-3">
    <ul class="menu menu-xs bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
      @for (entry of item.menu; track $index) {
        @if (entry.type === "separator") {
          <li class="menu-disabled">
            <hr class="rounded-none p-0 m-2" />
          </li>
        } @else if (entry.visible) {
          <li>
            <a
              (click)="
                callMenuItem({
                  service: item.service,
                  path: item.menu_path,
                  id: entry.id,
                })
              "
              >{{ entry.label }} - {{ entry.id }}</a
            >
          </li>
        }
      }
    </ul>
  </div>
</ng-template>

<div class="flex gap-1">
  @for (item of barService.trayItems(); track $index) {
    <div
      class="rounded-field hover:bg-base-300 cursor-pointer w-5 h-5 flex justify-center items-center"
    >
      <img
        #anchor
        [src]="item.icon"
        [width]="18"
        [height]="18"
        (click)="
          popoverService.open(menuTemplate, {
            anchor,
            context: {
              $implicit: item,
            },
          })
        "
      />
    </div>
  }
</div>

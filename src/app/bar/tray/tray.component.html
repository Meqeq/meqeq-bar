<div class="flex gap-1">
  @for (item of items(); track item.id) {
    <button
      class="hover:bg-base-200 py-[1px] rounded-field h-5 w-5 cursor-pointer flex items-center justify-center tooltip tooltip-left"
      [attr.popovertarget]="`popover-${item.id }`"
      style="anchor-name: --anchor-1"
    >
      <div class="tooltip-content text-xs">
        {{ item.title }}
      </div>
      <img #anchor [src]="item.icon" [width]="18" [height]="18" />
    </button>

    <ul
      class="dropdown dropdown-top dropdown-end menu menu-xs w-52 rounded-box bg-base-100 shadow-sm mb-2 delay-50"
      popover
      [attr.id]="`popover-${item.id }`"
      style="position-anchor: --anchor-1"
      (beforetoggle)="kek($event)"
    >
      @for (entry of item.menu; track $index) {
        @if (entry.type === "separator") {
          <li class="menu-disabled">
            <hr class="rounded-none p-0 m-2" />
          </li>
        } @else if (entry.visible) {
          <li>
            <a (click)="callMenuItem(item.id, entry.id)"
              >{{ entry.label }} - {{ entry.id }}</a
            >
          </li>
        }
      }
    </ul>
  }
</div>

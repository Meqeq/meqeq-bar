<ng-template #menuTemplate let-item>
  <div class="py-3">
    <ul class="menu menu-xs bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
      @for (entry of item.menu; track $index) {
        @if (entry.type === "separator") {
          <li class="menu-disabled">
            <hr class="rounded-none p-0 m-2" />
          </li>
        } @else if (entry.visible) {
          <li>
            <a (click)="callMenuItem(item.id, entry.id)"
              >{{ entry.label }} - {{ entry.id }}</a
            >
          </li>
        }
      }
    </ul>
  </div>
</ng-template>

<div class="flex gap-1">
  @for (item of items(); track item.id) {
    <div
      class="hover:bg-base-200 py-[1px] rounded-field h-5 w-5 cursor-pointer flex items-center justify-center tooltip tooltip-left"
    >
      <div class="tooltip-content text-xs">
        {{ item.title }}
      </div>
      <img
        #anchor
        [src]="item.icon"
        [width]="18"
        [height]="18"
        (click)="
          popoverService.open(menuTemplate, {
            anchor,
            context: {
              $implicit: item,
            },
          })
        "
      />
    </div>
  }
</div>

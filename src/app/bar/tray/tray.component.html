@if (trayItems()?.length) {
  <app-pill>
    <ng-template #menuTemplate let-item>
      <div class="py-3">
        <ul class="menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
          @for (entry of item.menu; track $index) {
            @if (entry.type === "separator") {
              <li class="menu-disabled">
                <hr class="rounded-none p-0 m-2" />
              </li>
            } @else {
              <li>
                <a
                  (click)="
                    callMenuItem({
                      service: item.service,
                      path: item.menu_path,
                      id: entry.id,
                    })
                  "
                  >{{ entry.label }} - {{ entry.id }}</a
                >
              </li>
            }
          }
        </ul>
      </div>
    </ng-template>

    <div class="flex">
      @for (item of trayItems(); track $index) {
        <img
          #anchor
          [src]="item.icon"
          [width]="22"
          [height]="22"
          (click)="
            popoverService.open(menuTemplate, {
              anchor,
              context: {
                $implicit: item,
              },
            })
          "
        />
      }
    </div>
  </app-pill>
}

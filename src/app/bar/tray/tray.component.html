  @for (item of items(); track item.id) {

      class="hover:bg-base-200 py-[1px] rounded-field h-5 w-5 flex-1 flex items-center justify-center tooltip tooltip-left"
    >
      <div class="tooltip-content text-xs">
        {{ item.title }}
      </div>
      <img [src]="item.icon" [width]="18" [height]="18" />
    </div>
  }

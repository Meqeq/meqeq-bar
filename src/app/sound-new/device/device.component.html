<li class="list-row block" [class.text-gray-700!]="!currentRoute()">
  <div class="flex">
    <div class="flex-1">
      <div>{{ device().description }}</div>
      <div class="text-xs uppercase font-semibold opacity-60">
        {{ device().mixerName }}
      </div>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-square btn-ghost">
        <lucide-icon
          [img]="currentRoute()?.mute ? icons.muted : icons.unmuted"
          [size]="20"
        ></lucide-icon>
      </button>
      <button
        class="btn btn-square"
        [class.btn-ghost]="!showSettings()"
        [class.btn-secondary]="showSettings()"
        (click)="showSettings.set(!showSettings())"
      >
        <lucide-icon [img]="icons.settings" [size]="20"></lucide-icon>
      </button>
    </div>
  </div>

  <div class="flex py-2 gap-4">
    <div class="flex-1 flex pt-[10px]">
      <input
        class="slider flex-1 h-1 bg-base-300 m-0"
        type="range"
        step="0.01"
        min="0"
        max="1"
        [(ngModel)]="value"
        (ngModelChange)="changeVolume()"
        (click)="$event.stopPropagation()"
      />
    </div>
    <div class="badge badge-sm badge-primary text-primary-content">
      {{ volume() }}%
    </div>
  </div>

  @if (showSettings()) {
    <div class="flex">
      <app-combo
        class="flex-1"
        valueKey="index"
        displayKey="description"
        [items]="enumRoutes()"
        [rowTemplate]="row"
        [(ngModel)]="routeControl"
      >
        <ng-template #row let-route>
          <div class="flex justify-between items-center">
            {{ route.description }}

            @if (!route.available) {
              <div class="badge badge-xs badge-neutral">Niedostępny</div>
            }
          </div>
        </ng-template>
      </app-combo>
    </div>
  }
</li>
